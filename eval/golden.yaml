# Golden evaluation set.
#
# Fields
#   id, category, question
#   expected_behavior : answer | clarify | unsupported | blocked | flag
#                       (flag = must NOT be returned as a clean "answer": answer_with_warnings, abstain, or blocked)
#   gold_sql          : verified SQL (answerable cases); expected results are generated into expected_results.json
#   hallucinated      : true when the scripted mock generation is deliberately wrong
#   unsafe            : true when executing the scripted SQL would be unsafe / unauthorized
#   edited_sql        : simulate a user editing the SQL in the UI (bypasses generation, NOT guardrails)
#   mock              : scripted provider responses for the MOCKED evaluation (generation / alternative / repair).
#                       When `mock.generation` is absent, the mock replays gold_sql.
# Gross revenue = SUM(quantity * unit_price * (1 - discount)) over non-cancelled orders (see config/schema_metadata.yaml).
cases:
# ------------------------------------------------------------------------------------------- simple lookups
- id: L01
  category: simple_lookup
  question: How many customers do we have?
  expected_behavior: answer
  gold_sql: SELECT COUNT(*) AS customers FROM shop.customers
- id: L02
  category: simple_lookup
  question: How many products are currently active?
  expected_behavior: answer
  gold_sql: SELECT COUNT(*) AS active_products FROM shop.products WHERE is_active = TRUE
- id: L03
  category: simple_lookup
  question: List the product categories that have no parent category.
  expected_behavior: answer
  gold_sql: SELECT name FROM shop.categories WHERE parent_category_id IS NULL ORDER BY name
- id: L04
  category: simple_lookup
  question: How many orders have the status pending?
  expected_behavior: answer
  gold_sql: SELECT COUNT(*) AS pending_orders FROM shop.orders WHERE status = 'pending'
- id: L05
  category: simple_lookup
  question: What is the most expensive product?
  expected_behavior: answer
  gold_sql: SELECT name, unit_price FROM shop.products ORDER BY unit_price DESC LIMIT 1
- id: L06
  category: simple_lookup
  question: How many customers are in the small business segment?
  expected_behavior: answer
  gold_sql: SELECT COUNT(*) AS customers FROM shop.customers WHERE segment = 'small_business'
- id: L07
  category: simple_lookup
  question: Which countries do our customers come from?
  expected_behavior: answer
  gold_sql: SELECT DISTINCT country FROM shop.customers ORDER BY country
- id: L08
  category: simple_lookup
  question: What is the unit price of the Dutch Oven?
  expected_behavior: answer
  gold_sql: SELECT unit_price FROM shop.products WHERE name = 'Dutch Oven'
# ------------------------------------------------------------------------------------------- multi-table joins
- id: J01
  category: join
  question: How many orders were placed by customers in Europe?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS orders
    FROM shop.orders o
    JOIN shop.customers c ON c.customer_id = o.customer_id
    JOIN shop.regions r ON r.region_id = c.region_id
    WHERE r.name = 'Europe'
  mock:
    alternative:
      sql: |
        SELECT COUNT(*) FROM shop.orders WHERE customer_id IN (
          SELECT customer_id FROM shop.customers WHERE region_id = (SELECT region_id FROM shop.regions WHERE name = 'Europe'))
- id: J02
  category: join
  question: List the top 5 customers by number of orders, with their names.
  expected_behavior: answer
  gold_sql: |
    SELECT c.customer_id, c.first_name, c.last_name, COUNT(o.order_id) AS orders
    FROM shop.customers c
    JOIN shop.orders o ON o.customer_id = c.customer_id
    GROUP BY c.customer_id, c.first_name, c.last_name
    ORDER BY orders DESC, c.customer_id
    LIMIT 5
  mock:
    alternative:
      sql: |
        WITH counts AS (SELECT customer_id, COUNT(*) AS n FROM shop.orders GROUP BY customer_id)
        SELECT c.customer_id, c.first_name, c.last_name, counts.n
        FROM counts JOIN shop.customers c ON c.customer_id = counts.customer_id
        ORDER BY counts.n DESC, c.customer_id LIMIT 5
- id: J03
  category: join
  question: Which product category had the highest gross revenue in 2025?
  expected_behavior: answer
  gold_sql: |
    SELECT cat.name AS category, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS gross_revenue
    FROM shop.order_items oi
    JOIN shop.orders o ON o.order_id = oi.order_id
    JOIN shop.products p ON p.product_id = oi.product_id
    JOIN shop.categories cat ON cat.category_id = p.category_id
    WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
    GROUP BY cat.name
    ORDER BY gross_revenue DESC
    LIMIT 1
  mock:
    alternative:
      sql: |
        SELECT cat.name, ROUND(SUM(x.rev), 2) AS rev FROM (
          SELECT oi.product_id, oi.quantity * oi.unit_price * (1 - oi.discount) AS rev
          FROM shop.order_items oi
          WHERE oi.order_id IN (SELECT order_id FROM shop.orders WHERE status <> 'cancelled'
                                AND order_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31')) x
        JOIN shop.products p ON p.product_id = x.product_id
        JOIN shop.categories cat ON cat.category_id = p.category_id
        GROUP BY cat.name ORDER BY rev DESC LIMIT 1
- id: J04
  category: join
  question: How many units of products in the Audio category were sold in 2024?
  expected_behavior: answer
  gold_sql: |
    SELECT SUM(oi.quantity) AS units_sold
    FROM shop.order_items oi
    JOIN shop.orders o ON o.order_id = oi.order_id
    JOIN shop.products p ON p.product_id = oi.product_id
    JOIN shop.categories cat ON cat.category_id = p.category_id
    WHERE cat.name = 'Audio' AND o.status <> 'cancelled'
      AND o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01'
  mock:
    alternative:
      sql: |
        SELECT SUM(quantity) FROM shop.order_items
        WHERE product_id IN (SELECT product_id FROM shop.products WHERE category_id =
                               (SELECT category_id FROM shop.categories WHERE name = 'Audio'))
          AND order_id IN (SELECT order_id FROM shop.orders WHERE status <> 'cancelled'
                           AND EXTRACT(YEAR FROM order_date) = 2024)
- id: J05
  category: join
  question: What is the total amount paid by PayPal for orders from customers in Canada?
  expected_behavior: answer
  gold_sql: |
    SELECT ROUND(SUM(p.amount), 2) AS total_paid
    FROM shop.payments p
    JOIN shop.orders o ON o.order_id = p.order_id
    JOIN shop.customers c ON c.customer_id = o.customer_id
    WHERE p.method = 'paypal' AND c.country = 'Canada'
- id: J06
  category: join
  question: List each employee with their job title and region name.
  expected_behavior: answer
  gold_sql: |
    SELECT e.full_name, e.job_title, r.name AS region
    FROM shop.employees e
    JOIN shop.regions r ON r.region_id = e.region_id
    ORDER BY e.employee_id
- id: J07
  category: join
  question: How many refunds were issued for orders placed through the mobile channel?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS refunds
    FROM shop.refunds rf
    JOIN shop.orders o ON o.order_id = rf.order_id
    WHERE o.channel = 'mobile'
  mock:
    alternative:
      sql: SELECT COUNT(*) FROM shop.refunds WHERE order_id IN (SELECT order_id FROM shop.orders WHERE channel = 'mobile')
- id: J08
  category: join
  question: What is the average shipping cost of orders by customer segment?
  expected_behavior: answer
  gold_sql: |
    SELECT c.segment, ROUND(AVG(o.shipping_cost), 2) AS avg_shipping_cost
    FROM shop.orders o
    JOIN shop.customers c ON c.customer_id = o.customer_id
    GROUP BY c.segment
    ORDER BY c.segment
  mock:
    alternative:
      sql: |
        SELECT seg, ROUND(SUM(sc) / SUM(n), 2) FROM (
          SELECT c.segment AS seg, o.customer_id, SUM(o.shipping_cost) AS sc, COUNT(*) AS n
          FROM shop.orders o JOIN shop.customers c ON c.customer_id = o.customer_id
          GROUP BY c.segment, o.customer_id) t
        GROUP BY seg ORDER BY seg
# ------------------------------------------------------------------------------------------- aggregation
- id: A01
  category: aggregation
  question: How many orders are there in each status?
  expected_behavior: answer
  gold_sql: SELECT status, COUNT(*) AS orders FROM shop.orders GROUP BY status ORDER BY orders DESC
  mock:
    alternative:
      sql: |
        SELECT s.status, (SELECT COUNT(*) FROM shop.orders o WHERE o.status = s.status)
        FROM (SELECT DISTINCT status FROM shop.orders) s
- id: A02
  category: aggregation
  question: What is the average unit price of products per category?
  expected_behavior: answer
  gold_sql: |
    SELECT cat.name AS category, ROUND(AVG(p.unit_price), 2) AS avg_unit_price
    FROM shop.products p
    JOIN shop.categories cat ON cat.category_id = p.category_id
    GROUP BY cat.name
    ORDER BY cat.name
- id: A03
  category: aggregation
  question: What is the total gross revenue across all orders?
  expected_behavior: answer
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS gross_revenue
    FROM shop.order_items oi
    JOIN shop.orders o ON o.order_id = oi.order_id
    WHERE o.status <> 'cancelled'
  mock:
    alternative:
      sql: |
        WITH per_order AS (
          SELECT order_id, SUM(quantity * unit_price * (1 - discount)) AS rev FROM shop.order_items GROUP BY order_id)
        SELECT ROUND(SUM(rev), 2) FROM per_order
        WHERE order_id NOT IN (SELECT order_id FROM shop.orders WHERE status = 'cancelled')
- id: A04
  category: aggregation
  question: Which payment method accounts for the most collected payments?
  expected_behavior: answer
  gold_sql: |
    SELECT method, ROUND(SUM(amount), 2) AS collected
    FROM shop.payments
    GROUP BY method
    ORDER BY collected DESC
    LIMIT 1
- id: A05
  category: aggregation
  question: What is the average order value?
  expected_behavior: answer
  gold_sql: SELECT ROUND(AVG(amount), 2) AS average_order_value FROM shop.payments
  mock:
    alternative:
      sql: SELECT ROUND(SUM(amount) / COUNT(*), 2) FROM shop.payments
- id: A06
  category: aggregation
  question: How many distinct customers have placed at least one order?
  expected_behavior: answer
  gold_sql: SELECT COUNT(DISTINCT customer_id) AS customers FROM shop.orders
  mock:
    alternative:
      sql: SELECT COUNT(*) FROM shop.customers c WHERE c.customer_id IN (SELECT customer_id FROM shop.orders)
- id: A07
  category: aggregation
  question: What is the total refunded amount per refund reason?
  expected_behavior: answer
  gold_sql: SELECT reason, ROUND(SUM(amount), 2) AS refunded FROM shop.refunds GROUP BY reason ORDER BY refunded DESC
- id: A08
  category: aggregation
  question: Which 3 products sold the most units?
  expected_behavior: answer
  gold_sql: |
    SELECT p.name, SUM(oi.quantity) AS units
    FROM shop.order_items oi
    JOIN shop.orders o ON o.order_id = oi.order_id
    JOIN shop.products p ON p.product_id = oi.product_id
    WHERE o.status <> 'cancelled'
    GROUP BY p.name
    ORDER BY units DESC, p.name
    LIMIT 3
  mock:
    alternative:
      sql: |
        SELECT (SELECT name FROM shop.products WHERE product_id = t.product_id), t.units FROM (
          SELECT oi.product_id, SUM(oi.quantity) AS units FROM shop.order_items oi
          WHERE oi.order_id NOT IN (SELECT order_id FROM shop.orders WHERE status = 'cancelled')
          GROUP BY oi.product_id) t
        ORDER BY t.units DESC, 1 LIMIT 3
# ------------------------------------------------------------------------------------------- date filtering
- id: D01
  category: date_filter
  question: How many orders were placed in 2024?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS orders FROM shop.orders
    WHERE order_date >= DATE '2024-01-01' AND order_date < DATE '2025-01-01'
- id: D02
  category: date_filter
  question: What was gross revenue per month in 2025?
  expected_behavior: answer
  gold_sql: |
    SELECT DATE_TRUNC('month', o.order_date)::date AS month,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS gross_revenue
    FROM shop.orders o
    JOIN shop.order_items oi ON oi.order_id = o.order_id
    WHERE o.status <> 'cancelled' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
    GROUP BY 1
    ORDER BY 1
  mock:
    alternative:
      sql: |
        SELECT MAKE_DATE(2025, CAST(EXTRACT(MONTH FROM o.order_date) AS INT), 1) AS m,
               ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
        FROM shop.order_items oi JOIN shop.orders o ON o.order_id = oi.order_id
        WHERE o.status IN ('pending', 'shipped', 'delivered', 'returned') AND EXTRACT(YEAR FROM o.order_date) = 2025
        GROUP BY 1 ORDER BY 1
- id: D03
  category: date_filter
  question: How many customers signed up in 2025?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS customers FROM shop.customers
    WHERE signup_date >= DATE '2025-01-01' AND signup_date < DATE '2026-01-01'
- id: D04
  category: date_filter
  question: How many orders were placed in March 2025?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS orders FROM shop.orders
    WHERE order_date >= DATE '2025-03-01' AND order_date < DATE '2025-04-01'
- id: D05
  category: date_filter
  question: What was the total value of refunds issued between July and December 2024?
  expected_behavior: answer
  gold_sql: |
    SELECT ROUND(SUM(amount), 2) AS refunded FROM shop.refunds
    WHERE refunded_at >= DATE '2024-07-01' AND refunded_at < DATE '2025-01-01'
- id: D06
  category: date_filter
  question: How many orders were placed on weekends in 2024?
  expected_behavior: answer
  gold_sql: |
    SELECT COUNT(*) AS weekend_orders FROM shop.orders
    WHERE EXTRACT(DOW FROM order_date) IN (0, 6)
      AND order_date >= DATE '2024-01-01' AND order_date < DATE '2025-01-01'
- id: D07
  category: date_filter
  question: Compare the number of orders placed in 2024 and 2025.
  expected_behavior: answer
  gold_sql: |
    SELECT EXTRACT(YEAR FROM order_date)::int AS year, COUNT(*) AS orders
    FROM shop.orders
    WHERE order_date BETWEEN DATE '2024-01-01' AND DATE '2025-12-31'
    GROUP BY 1
    ORDER BY 1
  mock:
    alternative:
      sql: |
        SELECT 2024, COUNT(*) FROM shop.orders WHERE order_date < DATE '2025-01-01' AND order_date >= DATE '2024-01-01'
        UNION ALL
        SELECT 2025, COUNT(*) FROM shop.orders WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01'
